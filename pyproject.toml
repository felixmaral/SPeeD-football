[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wcpredictor"
version = "0.1.0b1"
description = "Sistema de predicción estadística de fútbol (Mundial → multi-liga) con arquitectura hexagonal"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "felixmaral131", email = "felixmaral131@gmail.com" }]
keywords = ["football", "prediction", "dixon-coles", "world-cup", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Entrenamiento de modelos (no requerido para ejecutar predicciones).
train = ["pymc>=5.10", "mlflow>=2.11"]
# Bot de Telegram (fase v1.0).
bot = ["python-telegram-bot>=21.0"]
# Scheduler (fase v1.1).
scheduler = ["apscheduler>=3.10"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.scripts]
wcpredictor = "wcpredictor.delivery.cli.launcher:main"

[project.urls]
Repository = "https://github.com/felixmaral/speed-world-cup"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpredictor"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
